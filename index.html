<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbital Atlas — the global space ecosystem</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛰️</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap"
    />
  </head>
  <body>
    <canvas id="starfield" aria-hidden="true"></canvas>
    <div id="map"></div>

    <header id="topbar">
      <div id="brand">
        <h1>Orbital Atlas</h1>
        <span>The global space ecosystem, mapped</span>
      </div>
      <div id="search-wrap">
        <input id="search" type="search" placeholder="Search organizations, cities, tags…" aria-label="Search organizations" autocomplete="off" />
        <div id="search-results" role="listbox" hidden></div>
      </div>
      <select id="country-filter" aria-label="Filter by country"></select>
      <button id="tour-btn" title="Guided tour of global highlights">✦ Take the tour</button>
      <button id="reset-btn" title="Reset view" aria-label="Reset map view">⌂</button>
    </header>

    <aside id="legend" aria-label="Category legend"></aside>
    <aside id="stats" role="dialog" aria-label="Country summary" hidden></aside>
    <aside id="panel" role="dialog" aria-label="Organization profile" hidden></aside>
    <div id="tour-card" role="dialog" aria-label="Guided tour" hidden></div>
    <div id="tooltip" role="tooltip" hidden></div>
    <div id="loading">Loading the world…</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
